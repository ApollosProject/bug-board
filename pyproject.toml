[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "venv",
    ".venv",
    "env",
    ".env",
    "__pycache__",
    ".git",
    "static",
    "templates",
    ".tox",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.vulture]
exclude = ["venv", ".venv", "env", ".env", "__pycache__", ".git", "static", "templates", ".tox", "build", "dist", "*.egg-info", "tests"]
ignore_decorators = ["@app.route", "@app.template_filter"]
ignore_names = [
    "breakdown",
    "deleted_line_numbers",
    "get_fixing_pr_attribution",
    "get_pull_request_attribution_metadata",
    "_candidate_score",
    "_get_blame_ranges",
    "_get_pull_request_files",
    "_line_overlap_count",
    "_original_merged_pull_request",
    "parse_pull_request_url",
    "post_weekly_changelog",
    "_reviewer_logins",
]
min_confidence = 60
