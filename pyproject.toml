[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "venv",
    ".venv",
    "env",
    ".env",
    "__pycache__",
    ".git",
    "static",
    "templates",
    ".tox",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.vulture]
exclude = ["venv", ".venv", "env", ".env", "__pycache__", ".git", "static", "templates", ".tox", "build", "dist", "*.egg-info", "tests"]
ignore_decorators = [
    "@app.after_request",
    "@app.before_request",
    "@app.context_processor",
    "@app.get",
    "@app.post",
    "@app.route",
    "@app.template_filter",
]
ignore_names = [
    "breakdown",
    "permanent",
    "post_weekly_changelog",
]
min_confidence = 60
