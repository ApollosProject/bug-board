name: Nightly explore
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/explore.yml
      - e2e.config.ts
      - scripts/explore-linear.mts
      - tests/fixtures/**
permissions:
  contents: read
concurrency:
  group: explore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  explore:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TEMP probe Linear file upload
        run: |
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==' | base64 -d > /tmp/probe.png
          size=$(wc -c < /tmp/probe.png | tr -d ' ')
          res=$(curl -s https://api.linear.app/graphql -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { fileUpload(contentType: \\\"image/png\\\", filename: \\\"probe.png\\\", size: $size) { success uploadFile { uploadUrl headers { key value } } } }\"}")
          echo "$res" | jq -c '{errors: [.errors[]?.message], extensions: [.errors[]?.extensions.userPresentableMessage], success: .data.fileUpload.success}'
          url=$(echo "$res" | jq -r '.data.fileUpload.uploadFile.uploadUrl // empty')
          if [ -n "$url" ]; then
            mapfile -t args < <(echo "$res" | jq -r '.data.fileUpload.uploadFile.headers[] | "-H", "\(.key): \(.value)"')
            curl -s -o /dev/null -w 'PUT status %{http_code}\n' -X PUT --data-binary @/tmp/probe.png -H "Content-Type: image/png" -H "Cache-Control: public, max-age=31536000" "${args[@]}" "$url"
          fi
      - run: npm run build
      - name: Install Chromium
        timeout-minutes: 10
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          npx playwright-core install --with-deps chromium
      - name: Explore fixture data
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          E2E_FIXTURES: "1"
        run: |
          # Earlier findings, open or closed, so the explorer does not report them again.
          # Within the run, e2e passes each step the findings so far.
          known=$(npx tsx scripts/explore-linear.mts known)
          code=0
          npx e2e explore "Explore /team (window presets, a custom date range, sorting, the engineering/everyone cohort, and each person page), /reviews (author, reviewer, and approved filters with back, reload, and reset), / and /projects (priority bugs, open work, timeline bars, out-of-office blocks, ready projects), and /dags (search and run-state filters); check every count, name, and control against the other pages and the URL. Already filed, do not report again: $known." \
            --agent explore --max-steps 12 --timeout 900000 --output .e2e/explore/nightly < /dev/null || code=$?
          # 1 means findings; 2+ is a config, environment, or runner failure.
          [ "$code" -le 1 ]
      - name: File new findings in Linear
        if: ${{ !cancelled() }}
        run: |
          echo "### Explore findings" >> "$GITHUB_STEP_SUMMARY"
          npx tsx scripts/explore-linear.mts ${{ github.ref == 'refs/heads/main' && 'file' || 'preview' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: explore-proof
          path: .e2e/
          include-hidden-files: true
          retention-days: 14
