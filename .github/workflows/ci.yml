name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      run_ai:
        description: Run uncached Luna tests through AI Gateway
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npx e2e run tests/dashboard.e2e.ts --no-cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-proof
          path: .e2e/
          include-hidden-files: true
          retention-days: 7
  # ponytail: retain required legacy check names until repository rules use validate.
  legacy-required:
    name: ${{ matrix.check }}
    needs: validate
    if: always()
    strategy:
      matrix:
        check: [mypy, ruff, vulture, unit-tests, gunicorn-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require native validation (legacy check-name compatibility)
        run: test "$VALIDATION_RESULT" = success
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
  luna:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_ai) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npx e2e run tests/luna.e2e.ts --no-cache
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-proof
          path: .e2e/
          include-hidden-files: true
          retention-days: 7
