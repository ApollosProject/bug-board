name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ai:
        description: Run uncached Luna tests through AI Gateway
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npx e2e run tests/dashboard.e2e.ts --no-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-proof
          path: .e2e/
          include-hidden-files: true
          retention-days: 7
  luna:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npx e2e run tests/luna.e2e.ts --no-cache
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-proof
          path: .e2e/
          include-hidden-files: true
          retention-days: 7
