name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
env:
  # PRs run only the e2e tests the diff can affect; main runs all.
  CHANGED_SINCE: ${{ github.event_name == 'pull_request' && format('--changed-since origin/{0}', github.base_ref) || '' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --changed-since diffs against the merge base with main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - name: Install Chromium
        timeout-minutes: 10
        # The runner image ships Chrome's system libraries; apt mirrors can be unreachable.
        run: npx playwright-core install chromium
      - run: npx e2e run tests/dashboard.e2e.ts --no-cache $CHANGED_SINCE
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - run: npx e2e run tests/churches.e2e.ts --no-cache $CHANGED_SINCE
        env:
          E2E_FIXTURES: "1"
          GITHUB_TOKEN: ${{ github.token }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - run: npx e2e run tests/reviews.e2e.ts --no-cache $CHANGED_SINCE
        env:
          E2E_FIXTURES: "1"
          GITHUB_TOKEN: ${{ github.token }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-proof
          path: .e2e/
          include-hidden-files: true
          retention-days: 7
  luna:
    # Forks and Dependabot get no Gateway key, and Luna fails without one.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        timeout-minutes: 10
        # The runner image ships Chrome's system libraries; apt mirrors can be unreachable.
        run: npx playwright-core install chromium
      - run: npx e2e run tests/luna.e2e.ts --no-cache $CHANGED_SINCE
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-proof
          path: .e2e/
          include-hidden-files: true
          retention-days: 7
